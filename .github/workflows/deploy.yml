# Builds the platform and publishes it to GitHub Pages:
#   https://haddeerwork-design.github.io/ms-group-crm/app/   -> the platform
#   https://haddeerwork-design.github.io/ms-group-crm/       -> opens the platform (old bookmarks keep working)
# The old one-page CRM was retired on 12 Nov 2026 (its data stays in Supabase,
# readable in "Old CRM Archive"; the file is in the git history).
# Pull requests only BUILD (to check nothing is broken). Publishing happens
# only from main. If the build fails, nothing is published.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Unit tests (pricing formulas)
        working-directory: app
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test admin-users Edge Function (fake Supabase)
        working-directory: supabase/functions/admin-users
        run: ADMIN_USERS_TEST=1 deno test --allow-env --allow-net index.test.ts

      - name: Test trade-data Edge Function (fake Comtrade)
        working-directory: supabase/functions/trade-data
        run: deno test --allow-env index.test.ts

      - name: Build new platform
        working-directory: app
        run: npm run build

      - name: Smoke test every page and role (fake data, no network)
        working-directory: app
        run: |
          # system packages sometimes fail to download on GitHub; the runner already has most of them
          npx playwright install --with-deps chromium || npx playwright install chromium
          npm run e2e

      - name: Assemble site (platform at /app, main address opens it)
        run: |
          mkdir _site
          shopt -s dotglob
          for f in *; do
            case "$f" in .git|.github|app|supabase|_site|README-PLATFORM.md) ;; *) cp -r "$f" _site/ ;; esac
          done
          mkdir -p _site/app
          cp -r app/dist/. _site/app/
          test -f _site/index.html || (echo "The main address page (index.html) is missing!" && exit 1)
          test -f _site/app/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
