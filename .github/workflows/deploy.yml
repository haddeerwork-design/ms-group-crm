# Builds the new React app and publishes it to GitHub Pages TOGETHER with the
# current CRM:
#   https://haddeerwork-design.github.io/ms-group-crm/       -> current CRM (index.html, unchanged)
#   https://haddeerwork-design.github.io/ms-group-crm/app/   -> new platform
# Pull requests only BUILD (to check nothing is broken). Publishing happens
# only from main. If the build fails, nothing is published.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Unit tests (pricing formulas)
        working-directory: app
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test admin-users Edge Function (fake Supabase)
        working-directory: supabase/functions/admin-users
        run: ADMIN_USERS_TEST=1 deno test --allow-env --allow-net index.test.ts

      - name: Build new platform
        working-directory: app
        env:
          # After the old CRM is switched off its link points to /legacy/ (see README-PLATFORM.md)
          VITE_LEGACY_CRM_URL: ${{ vars.LEGACY_MODE == 'retired' && 'https://haddeerwork-design.github.io/ms-group-crm/legacy/' || '' }}
        run: npm run build

      - name: Smoke test every page and role (fake data, no network)
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Assemble site (current CRM at root, new platform at /app)
        run: |
          mkdir _site
          shopt -s dotglob
          for f in *; do
            case "$f" in .git|.github|app|supabase|_site|README-PLATFORM.md) ;; *) cp -r "$f" _site/ ;; esac
          done
          mkdir -p _site/app
          cp -r app/dist/. _site/app/
          test -f _site/index.html || (echo "Current CRM index.html is missing!" && exit 1)
          test -f _site/app/index.html

      # Only when the repository variable LEGACY_MODE is set to "retired":
      # the old CRM moves to /legacy/ (kept for emergencies) and the main
      # address opens the new platform. Remove the variable to undo.
      - name: Switch main address to the new platform
        if: vars.LEGACY_MODE == 'retired'
        run: |
          mkdir -p _site/legacy
          mv _site/index.html _site/legacy/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>MS El-brancy Group</title>
          <meta http-equiv="refresh" content="0; url=./app/"><script>location.replace('./app/' + location.hash)</script></head>
          <body><a href="./app/">Open the MS El-brancy platform</a></body></html>
          HTML
          ls -la _site _site/legacy
          ls -la _site _site/app

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
